services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command:
      - node
      - /app/node_modules/@bestehen/infrastructure/dist/postgres/migrate-cli.js
    restart: "no"
    healthcheck:
      disable: true
    exclude_from_hc: true
    environment:
      BESTEHEN_APP_ENV: ${BESTEHEN_APP_ENV}
      BESTEHEN_RELEASE_COMMIT: ${BESTEHEN_RELEASE_COMMIT}
      DATABASE_URL: ${DATABASE_URL}
